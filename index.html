<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: "Vazirmatn", sans-serif;
      background: #161616;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 90%;
      max-width: 480px;
      background: #202020;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-box {
      height: 70vh;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .user-message, .bot-message {
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 75%;
      line-height: 1.4;
    }

    /* ✅ فقط این دو خط جابه‌جا شده */
    .user-message {
      background: #1565c0;
      align-self: flex-start; /* ← پیام کاربر سمت چپ */
    }
    .bot-message {
      background: #333;
      align-self: flex-end; /* → پیام Nova سمت راست */
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #1a1a1a;
      direction: ltr; /* ✅ فقط برای اینکه دکمه ارسال بره چپ */
    }
    input {
      flex: 1;
      padding: 8px;
      border: none;
      background: #2a2a2a;
      color: #fff;
      border-radius: 6px;
    }
    button {
      margin-left: 8px;
      background: #2196f3;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #1976d2;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
      <input id="messageInput" placeholder="بنویس چیزی..." autocomplete="off" />
      <button id="sendBtn">ارسال</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatBox = document.getElementById("chatBox");

    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.className = type === "user" ? "user-message" : "bot-message";
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function typeNovaMessage(text) {
      const msg = document.createElement("div");
      msg.className = "bot-message";
      chatBox.appendChild(msg);
      for (let i = 0; i <= text.length; i++) {
        msg.innerText = text.slice(0, i);
        await new Promise(r => setTimeout(r, 25));
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", async () => {
      const userText = input.value.trim();
      if (!userText) return;
      addMessage(userText, "user");
      input.value = "";

      const reply = window.Nova(userText);

      await new Promise(r => setTimeout(r, 400));
      typeNovaMessage(reply);
    });
  </script>
</body>
</html>
