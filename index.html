<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova PWA</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">

  <style>

    /* ------------------------ */
    /*   اصلاح شماره ۳ (اسکرول) */
    /* ------------------------ */
    body {
      margin: 0;
      background: #020617;
      overflow-y: auto;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    /* ------------------------ */
    /*      منوی نوا (Drawer)   */
    /* ------------------------ */

    .nova-menu-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      font-size: 26px;
      background: #0f172a;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1000;
    }

    .nova-drawer {
      position: fixed;
      top: 0;
      left: -25%;
      width: 25%;
      height: 100%;
      background: #0f172a;
      color: white;
      padding: 20px;
      box-shadow: 4px 0 12px rgba(0,0,0,0.4);
      transition: left 0.3s ease;
      z-index: 999;
    }

    .nova-drawer.open {
      left: 0;
    }

    /* ------------------------ */
    /*   اصلاح شماره ۱ (۷۵٪)    */
    /* ------------------------ */
    @media (max-width: 768px) {
      .nova-drawer {
        width: 75%;
        left: -75%;
      }
      .nova-drawer.open {
        left: 0;
      }
    }

    .nova-menu-title {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .nova-menu-item {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 8px;
      text-align: right;
      cursor: pointer;
      font-size: 16px;
    }

    .nova-menu-item:hover {
      background: #334155;
    }

    .nova-menu-item.danger {
      background: #7f1d1d;
    }

    .nova-menu-item.danger:hover {
      background: #991b1b;
    }


    /* ------------------------ */
    /*      پیام‌های چت         */
    /* ------------------------ */

    .chat-container {
      padding: 20px;
      padding-bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-message {
      align-self: flex-end;
      background: #38bdf8;
      color: black;
      padding: 12px 16px;
      border-radius: 16px 16px 0 16px;
      max-width: 70%;
      font-size: 16px;
      animation: fadeIn 0.3s ease;
    }

    .nova-message-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .nova-avatar {
      width: 38px;
      height: 38px;
      background: #4ade80;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .nova-message {
      background: #1e293b;
      color: #4ade80;
      padding: 12px 16px;
      border-radius: 16px 16px 16px 0;
      max-width: 70%;
      font-size: 16px;
      opacity: 0;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .typing {
      border-right: 2px solid #4ade80;
      white-space: nowrap;
      overflow: hidden;
    }


    /* ------------------------ */
    /*     ورودی پیام (Input)   */
    /* ------------------------ */

    .nova-input-bar {
      position: fixed;
      bottom: calc(15px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      background: #0f172a;
      padding: 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .nova-input {
      flex: 1;
      background: #1e293b;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 12px;
      resize: none;
      max-height: 120px;
      min-height: 40px;
      font-size: 16px;
      outline: none;
    }

    .input-btn {
      background: #1e293b;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .send-btn {
      background: #38bdf8;
      color: black;
      border: none;
      padding: 12px 14px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

  </style>
</head>

<body>
  <!-- دکمهٔ ربات -->
<button id="nova-menu-btn" class="nova-menu-btn">🤖</button>

<!-- منوی نُوا -->
<div id="nova-menu" class="nova-drawer">
  <h2 class="nova-menu-title">تنظیمات نُوا</h2>

  <button class="nova-menu-item" id="change-theme">🎨 تغییر تم</button>
  <button class="nova-menu-item" id="change-animation">✨ تغییر انیمیشن</button>
  <button class="nova-menu-item" id="change-font">🔤 اندازه فونت</button>
  <button class="nova-menu-item danger">🗑 ریست حافظه</button>
</div>

<!-- بخش پیام‌ها -->
<div id="chat-container" class="chat-container"></div>

<!-- ورودی پیام -->
<div class="nova-input-bar">
  <button class="input-btn">🎤</button>
  <button class="input-btn">📎</button>
  <button class="input-btn">📷</button>
  <button class="input-btn">📞</button>

  <textarea id="user-input" class="nova-input" placeholder="پیامت رو بنویس..."></textarea>

  <button id="sendBtn" class="send-btn">➤</button>
</div>
<!-- ------------------------ -->
<!--      اسکریپت‌ها          -->
<!-- ------------------------ -->

<script>

  /* باز و بسته کردن منو */
  const menuBtn = document.getElementById("nova-menu-btn");
  const menu = document.getElementById("nova-menu");

  menuBtn.addEventListener("click", () => {
    menu.classList.toggle("open");
  });


  /* پیام‌ها */
  const chat = document.getElementById("chat-container");
  const inputBox = document.getElementById("user-input");
  const sendBtn = document.getElementById("sendBtn");

  function addUserMessage(text) {
    const msg = document.createElement("div");
    msg.className = "user-message";
    msg.textContent = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  async function typeNovaMessage(text) {
    const wrapper = document.createElement("div");
    wrapper.className = "nova-message-wrapper";

    const avatar = document.createElement("div");
    avatar.className = "nova-avatar";
    avatar.textContent = "🤖";

    const msg = document.createElement("div");
    msg.className = "nova-message typing";

    wrapper.appendChild(avatar);
    wrapper.appendChild(msg);
    chat.appendChild(wrapper);

    let i = 0;
    while (i < text.length) {
      msg.textContent = text.slice(0, i + 1);
      i++;
      await new Promise(r => setTimeout(r, 20));
    }

    msg.classList.remove("typing");
    chat.scrollTop = chat.scrollHeight;
  }


  /* ارسال پیام */
  sendBtn.addEventListener("click", async () => {
    const text = inputBox.value.trim();
    if (!text) return;

    addUserMessage(text);
    inputBox.value = "";

    if (typeof window.Nova !== "function") {
      typeNovaMessage("❌ مغز نوا در دسترس نیست");
      return;
    }

    const reply = await window.Nova(text);
    typeNovaMessage(reply);
  });


  /* ورودی پویا */
  inputBox.addEventListener("input", () => {
    inputBox.style.height = "40px";
    inputBox.style.height = inputBox.scrollHeight + "px";
  });


  /* تنظیمات منو */
  document.getElementById("change-theme").addEventListener("click", () => {
    alert("در نسخهٔ بعدی: تغییر تم توسط کاربر");
  });

  document.getElementById("change-animation").addEventListener("click", () => {
    alert("در نسخهٔ بعدی: تغییر انیمیشن پیام‌ها");
  });

  document.getElementById("change-font").addEventListener("click", () => {
    alert("در نسخهٔ بعدی: تغییر اندازه فونت");
  });

</script>


<!-- سرویس ورکر -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
  }
</script>

</body>
</html>
